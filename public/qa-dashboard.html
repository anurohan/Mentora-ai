<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENTORA QA Dashboard</title><style>body{font:14px system-ui;margin:32px;color:#172033;background:#f5f7fb}h1{margin-bottom:4px}.muted{color:#65738a}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e2e7f0;border-radius:12px;padding:16px;min-width:150px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.controls input,.controls select{padding:9px;border:1px solid #cbd4e3;border-radius:8px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7ebf2;vertical-align:top}th{background:#eef1f7}.IMPLEMENTED{color:#147a58}.IN_PROGRESS{color:#9a6500}.NOT_STARTED{color:#9b3943}</style></head>
<body><h1>MENTORA developer QA dashboard</h1><p class="muted" id="meta">Loading report...</p><div class="cards" id="cards"></div><div class="controls"><select id="module"><option value="">All modules</option></select><select id="status"><option value="">All statuses</option></select><select id="priority"><option value="">All priorities</option></select><select id="test"><option value="">All test results</option></select><input id="search" placeholder="Search requirements"></div><table><thead><tr><th>ID</th><th>Feature</th><th>Module</th><th>Priority</th><th>Status</th><th>Test</th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table><script src="/qa-dashboard.js"></script></body></html>
